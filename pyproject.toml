[project]
name = "financials"
version = "0.1.0"
description = "AI Assisted Financial Analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lzstring>=1.0.4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0",
]

[tool.coverage.run]
# Measure the first-party application modules the unit suite exercises. The
# entry point (main.py), the file-backed cache (memo.py, mocked in the suite),
# and the legacy per-bank v1 extractors are intentionally excluded — they have
# no unit tests yet, so including them would report a misleading number rather
# than the coverage of the code actually under test.
source = ["analyze_pdf", "utils", "serve_frontend", "categorize"]

[tool.coverage.report]
show_missing = true
precision = 1
# Gate: fail if coverage of the measured modules drops below this. Current is
# ~63%; the floor is set a few points lower to absorb noise while preventing
# meaningful regressions. Raise it as coverage improves.
fail_under = 60
