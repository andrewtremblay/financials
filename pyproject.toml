[project]
name = "financials"
version = "0.1.0"
description = "AI Assisted Financial Analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-auth>=2.56.2",
    "gspread>=6.2.1",
    "langchain-anthropic>=1.4.3",
    "lzstring>=1.0.4",
    "pandas>=2.2.3",
    "docling",
    "tabulate",
    "pypdf>=5.1.0",
    "python-dotenv>=0.21.1",
    "langchain-community>=0.3.13",
    "langchain-core>=0.3.28",
    "langchain-ollama>=0.2.2",
    "langchain-openai>=0.2.14",
    "plaid-python>=42.0.0",
    "uvicorn[standard]>=0.52.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=9.0.2",
    "pytest-cov>=5.0",
    "ruff>=0.8.6",
]

[tool.coverage.run]
# Measure the first-party application modules the unit suite exercises. The
# entry point (main.py), the file-backed cache (memo.py, mocked in the suite),
# and the legacy per-bank v1 extractors are intentionally excluded — they have
# no unit tests yet, so including them would report a misleading number rather
# than the coverage of the code actually under test.
source = ["analyze_pdf", "utils", "serve_frontend", "categorize"]

[tool.coverage.report]
show_missing = true
precision = 1
# Gate: fail if coverage of the measured modules drops below this. Current is
# ~63%; the floor is set a few points lower to absorb noise while preventing
# meaningful regressions. Raise it as coverage improves.
fail_under = 60

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Bootstrap rule set: start with the critical, always-safe checks (syntax
# errors and pyflakes undefined-name/bug checks) so linting is green on the
# current codebase with no churn. Broader rules (unused imports, import
# sorting, style) are intentionally deferred until the in-flight cleanup PRs
# land, then this list can be widened toward ruff's defaults.
select = ["E9", "F63", "F7", "F82"]
