<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sankey Diagram Builder</title>
    <script>
      // Applied before React mounts / first paint, so the page never
      // flashes the wrong theme while the app boots. Mirrors the same
      // storage key + fallback logic as lib/theme.tsx's getInitialTheme().
      (function () {
        try {
          var stored = localStorage.getItem('sankey-theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
