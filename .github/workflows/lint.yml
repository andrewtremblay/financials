name: Lint

# Linting pipeline (ruff). The unit-test suite runs separately in
# unit-tests.yml, so this workflow is focused solely on static checks and does
# not install the project's runtime dependencies.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Run ruff
        run: uv run ruff check .
